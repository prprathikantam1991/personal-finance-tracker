spring:
  application:
    name: finance-tracker-api
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  datasource:
    url: jdbc:sqlite:data/finance-tracker.db
    driver-class-name: org.sqlite.JDBC
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.community.dialect.SQLiteDialect
  flyway:
    enabled: true
  ai:
    model:
      # The repository launcher explicitly selects openai for the supported
      # Spring AI Bedrock Mantle/Gemma runtime or bedrock-converse for Converse.
      chat: ${FINANCE_SPRING_AI_CHAT_MODEL:openai}
      embedding: none
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none
    # The repository launcher selects the supported Spring AI runtime. This
    # fallback preserves a direct-Maven custom-runtime startup without credentials.
    openai:
      # LM Studio uses its server root; Bedrock Mantle supplies its OpenAI-compatible
      # /openai base URL. Spring AI appends /v1/chat/completions for chat requests.
      base-url: ${FINANCE_SPRING_AI_OPENAI_BASE_URL:https://bedrock-mantle.us-east-1.api.aws/openai}
      # Spring AI requires a non-empty value even for a locally unauthenticated server.
      # The local placeholder is not a secret; Mantle receives the session-only API token.
      # A harmless sentinel lets the tracker start without a cloud credential.
      # The Mantle runtime then returns a clear setup message instead of blocking the whole app.
      api-key: ${FINANCE_SPRING_AI_OPENAI_API_KEY:${BEDROCK_API_KEY:${AWS_BEARER_TOKEN_BEDROCK:not-configured}}}
      chat:
        enabled: ${FINANCE_SPRING_AI_ENABLED:true}
        options:
          model: ${FINANCE_ASSISTANT_MODEL:google.gemma-4-31b}
          temperature: 0.1
          max-tokens: ${FINANCE_ASSISTANT_FINAL_ANSWER_MAX_TOKENS:1200}
          reasoning-effort: ${BEDROCK_REASONING_EFFORT:}
      embedding:
        enabled: false
    bedrock:
      aws:
        region: ${AWS_REGION:us-east-1}
        timeout: ${BEDROCK_TIMEOUT_MS:60000}
        profile:
          name: ${AWS_PROFILE:}
      converse:
        chat:
          options:
            model: ${FINANCE_ASSISTANT_MODEL:global.anthropic.claude-haiku-4-5-20251001-v1:0}
            temperature: 0.1

server:
  port: 8080

finance:
  security:
    # Authentication is mandatory. A verified Auth Service handoff creates the
    # opaque Finance session used to establish an owner for every request.
    session:
      cookie-name: finance_session
      cookie-secure: ${FINANCE_SESSION_COOKIE_SECURE:false}
      max-age: ${FINANCE_SESSION_MAX_AGE:PT8H}
      idle-timeout: ${FINANCE_SESSION_IDLE_TIMEOUT:PT30M}
      touch-interval: ${FINANCE_SESSION_TOUCH_INTERVAL:PT5M}
      cleanup-interval-ms: ${FINANCE_SESSION_CLEANUP_INTERVAL_MS:900000}
    cors:
      allowed-origin: ${FINANCE_CORS_ALLOWED_ORIGIN:http://localhost:4200}
    handoff:
      auth-service-url: ${AUTH_SERVICE_URL:http://localhost:8081}
      service-key: ${FINANCE_HANDOFF_SERVICE_KEY:}
      allowed-return-url: ${FINANCE_AUTH_RETURN_URL:http://localhost:4200/dashboard}
  storage:
    statements-directory: data/statements
  automation:
    incoming-directory: W:/projects/finance-tracker-incoming
    archive-directory: W:/projects/finance-tracker-archive
    scan-interval-ms: 30000
  assistant:
    # The supported normal path is Spring AI + Bedrock Mantle/Gemma. Any provider
    # can still be selected explicitly through environment variables or the launcher.
    provider: ${FINANCE_ASSISTANT_PROVIDER:bedrock-mantle}
    runtime: ${FINANCE_ASSISTANT_RUNTIME:spring-ai-bedrock-mantle}
    model: ${FINANCE_ASSISTANT_MODEL:google.gemma-4-31b}
    final-answer-max-tokens: ${FINANCE_ASSISTANT_FINAL_ANSWER_MAX_TOKENS:1200}
    tool-selection-max-tokens: ${FINANCE_ASSISTANT_TOOL_SELECTION_MAX_TOKENS:160}
    lm-studio:
      base-url: ${LM_STUDIO_BASE_URL:http://localhost:1234/v1}
      api-key: ${LM_STUDIO_API_KEY:}
      timeout-ms: ${LM_STUDIO_TIMEOUT_MS:60000}
    bedrock:
      region: ${AWS_REGION:us-east-1}
      profile: ${AWS_PROFILE:}
      timeout-ms: ${BEDROCK_TIMEOUT_MS:60000}
      mantle:
        base-url: ${BEDROCK_MANTLE_BASE_URL:https://bedrock-mantle.us-east-1.api.aws/openai/v1}
        api-key: ${BEDROCK_API_KEY:${AWS_BEARER_TOKEN_BEDROCK:}}
        reasoning-effort: ${BEDROCK_REASONING_EFFORT:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
