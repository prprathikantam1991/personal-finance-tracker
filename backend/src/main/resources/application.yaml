spring:
  application:
    name: finance-tracker-api
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  datasource:
    url: jdbc:sqlite:data/finance-tracker.db
    driver-class-name: org.sqlite.JDBC
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.community.dialect.SQLiteDialect
  flyway:
    enabled: true
  ai:
    model:
      # The repository launcher explicitly selects openai for the supported
      # Spring AI Bedrock Mantle/Gemma runtime or bedrock-converse for Converse.
      chat: ${FINANCE_SPRING_AI_CHAT_MODEL:none}
      embedding: none
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none
    # The repository launcher selects the supported Spring AI runtime. This
    # fallback preserves a direct-Maven custom-runtime startup without credentials.
    openai:
      # LM Studio uses its server root; Bedrock Mantle supplies its OpenAI-compatible
      # /openai base URL. Spring AI appends /v1/chat/completions for chat requests.
      base-url: ${FINANCE_SPRING_AI_OPENAI_BASE_URL:http://localhost:1234}
      # Spring AI requires a non-empty value even for a locally unauthenticated server.
      # The local placeholder is not a secret; Mantle receives the session-only API token.
      api-key: ${FINANCE_SPRING_AI_OPENAI_API_KEY:lm-studio}
      chat:
        enabled: ${FINANCE_SPRING_AI_ENABLED:false}
        options:
          model: ${FINANCE_ASSISTANT_MODEL:gemma-4-e2b-it-qat}
          temperature: 0.1
          max-tokens: ${FINANCE_ASSISTANT_FINAL_ANSWER_MAX_TOKENS:1200}
          reasoning-effort: ${BEDROCK_REASONING_EFFORT:}
      embedding:
        enabled: false
    bedrock:
      aws:
        region: ${AWS_REGION:us-east-1}
        timeout: ${BEDROCK_TIMEOUT_MS:60000}
        profile:
          name: ${AWS_PROFILE:}
      converse:
        chat:
          options:
            model: ${FINANCE_ASSISTANT_MODEL:global.anthropic.claude-haiku-4-5-20251001-v1:0}
            temperature: 0.1

server:
  port: 8080

finance:
  storage:
    statements-directory: data/statements
  automation:
    incoming-directory: W:/projects/finance-tracker-incoming
    archive-directory: W:/projects/finance-tracker-archive
    scan-interval-ms: 30000
  assistant:
    # Change to "bedrock" only after local AWS credentials and model access are configured.
    provider: ${FINANCE_ASSISTANT_PROVIDER:lm-studio}
    # custom is the proven V4 runtime. Spring AI paths are opt-in for V6 parity testing.
    runtime: ${FINANCE_ASSISTANT_RUNTIME:custom}
    model: ${FINANCE_ASSISTANT_MODEL:gemma-4-e2b-it-qat}
    final-answer-max-tokens: ${FINANCE_ASSISTANT_FINAL_ANSWER_MAX_TOKENS:1200}
    tool-selection-max-tokens: ${FINANCE_ASSISTANT_TOOL_SELECTION_MAX_TOKENS:160}
    lm-studio:
      base-url: ${LM_STUDIO_BASE_URL:http://localhost:1234/v1}
      api-key: ${LM_STUDIO_API_KEY:}
      timeout-ms: ${LM_STUDIO_TIMEOUT_MS:60000}
    bedrock:
      region: ${AWS_REGION:us-east-1}
      profile: ${AWS_PROFILE:}
      timeout-ms: ${BEDROCK_TIMEOUT_MS:60000}
      mantle:
        base-url: ${BEDROCK_MANTLE_BASE_URL:https://bedrock-mantle.us-east-1.api.aws/openai/v1}
        api-key: ${BEDROCK_API_KEY:${AWS_BEARER_TOKEN_BEDROCK:}}
        reasoning-effort: ${BEDROCK_REASONING_EFFORT:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
