spring:
  application:
    name: finance-tracker-api
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  datasource:
    url: jdbc:sqlite:data/finance-tracker.db
    driver-class-name: org.sqlite.JDBC
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.community.dialect.SQLiteDialect
  flyway:
    enabled: true

server:
  port: 8080

finance:
  storage:
    statements-directory: data/statements
  automation:
    incoming-directory: W:/projects/finance-tracker-incoming
    archive-directory: W:/projects/finance-tracker-archive
    scan-interval-ms: 30000
  assistant:
    lm-studio:
      base-url: ${LM_STUDIO_BASE_URL:http://localhost:1234/v1}
      model: ${LM_STUDIO_MODEL:gemma-4-e2b-it-qat}
      api-key: ${LM_STUDIO_API_KEY:}
      timeout-ms: ${LM_STUDIO_TIMEOUT_MS:30000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
